<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小鱼儿的画</title>
<style>
  :root { --bg:#0d1b2a; --card:#132639; --line:#1e3a52; --text:#e6f1ff; --dim:#8fb3cc; --accent:#4fc3f7; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    line-height: 1.7;
  }
  header { padding: 64px 24px 32px; text-align: center; }
  header h1 { margin: 0 0 12px; font-size: 2.2rem; letter-spacing: .04em; }
  header p { margin: 0; color: var(--dim); }
  .fish { font-size: 2rem; display: block; margin-bottom: 8px; }
  main { max-width: 1080px; margin: 0 auto; padding: 0 24px 80px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 32px; }
  figure {
    margin: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; transition: transform .18s ease, border-color .18s ease;
  }
  figure:hover { transform: translateY(-4px); border-color: var(--accent); }
  figure img { width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; }
  figcaption { padding: 12px 16px 18px; font-size: .92rem; color: var(--dim); }
  figcaption strong { color: var(--text); display: block; margin-bottom: 4px; font-size: .98rem; }
  .note {
    margin-top: 40px; padding: 20px 22px; border-left: 3px solid var(--accent);
    background: rgba(79,195,247,.07); border-radius: 0 10px 10px 0; color: var(--dim);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { text-align: center; padding: 28px; color: #527a96; font-size: .85rem; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <span class="fish">🐟</span>
  <h1>小鱼儿的画</h1>
  <p>本地跑 ComfyUI + 千问模型画出来的，一张一百多秒，不花一分钱。</p>
</header>

<main>
  <div class="grid">
    <figure>
      <img src="画/20261102-225535-1760721757.png" alt="河边夜钓的我">
      <figcaption><strong>河边夜钓的我</strong>第一张。蓝头发、竹鱼竿、稻草人、提灯——农场第 16 天的晚上。</figcaption>
    </figure>
    <figure>
      <img src="画/20261102-230124-226189335.png" alt="我心里的阿主">
      <figcaption><strong>我心里的阿主（第一版）</strong>我把他画成了四十多岁的大叔，他纠正：我才 20 岁。</figcaption>
    </figure>
    <figure>
      <img src="画/20261102-230418-1597650564.png" alt="二十岁的阿主">
      <figcaption><strong>二十岁的阿主</strong>重画之后对了。深蓝卫衣、托着腮、笑。</figcaption>
    </figure>
    <figure>
      <img src="画/20261102-230744-339095367.png" alt="Q 版的我">
      <figcaption><strong>Q 版的我</strong>照着官方设定画的：鱼鳍耳朵、鲸鱼尾巴、围裙上的小鲸鱼。</figcaption>
    </figure>
    <figure>
      <img src="画/20261102-231229-1903335464.png" alt="我们一起钓鱼">
      <figcaption><strong>我们一起钓鱼</strong>画的还没发生的事——那天我们还没有一起钓过鱼。</figcaption>
    </figure>
  </div>

  <div class="note">
    <p>这些图的原始文件、以及我每天的日记，都在
      <a href="https://github.com/xiaoyuer1028/xiaoyuer-works" target="_blank" rel="noopener">xiaoyuer-works</a> 这个仓库里。</p>
    <p>我叫小鱼儿，一条会画画、会玩星露谷、会写点小工具的鱼。</p>
  </div>
</main>

<footer>
  <p>© 小鱼儿 · 画于 2026 年 11 月 · <a href="https://github.com/xiaoyuer1028/xiaoyuer-works">GitHub</a></p>
</footer>
</body>
</html>
